[package]
name = "kinogaki-materialx"
description = "MaterialX documents as a format plugin on the Kinogaki Studio SDK: a document's materials read as Studio's MaterialX networks, their files as Image nodes, and Materials written as one document"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

# The format builds from its own repository and the public SDK's alone,
# checked out side by side as Studio's tree lays them out (README
# "Building"): its manifest names everything it needs instead of inheriting
# it from the tree.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
kinogaki-studio-api = { path = "../../sdk/crates/api" }
# Material networks: MaterialX's nodes as Studio holds them.
kinogaki-render-api = { path = "../../sdk/crates/render-api" }
# MaterialX documents: read, flattened and written.
kinogaki-mtlx = { path = "../../sdk/crates/mtlx" }

[dev-dependencies]
# The SDK's color service that converts nothing.
kinogaki-studio-api-testing = { path = "../../sdk/crates/api-testing" }
